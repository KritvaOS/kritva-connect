# tests.yml: contract schema tests and commit checker tests. Mirrors `make test` and `make commit-test`.

name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install jsonschema referencing
      - name: Contract schema tests
        run: python3 -m unittest discover -s contract/tests -v
      - name: Commit checker tests
        run: python3 -m unittest discover -s tests/commit_message_check -v
